# Fly.io — WILLBOUND catalog API
# Deploy: cd catalog && fly deploy

app = 'willbound-catalog-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  UPLOAD_DIR = '/data/uploads'
  DATABASE_SSL = 'true'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'willbound_uploads'
  destination = '/data/uploads'
